<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taking you to Amazon | Real Talk</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/css/site.css">
<style>
  body{background:var(--navy);color:var(--offwhite);display:grid;place-items:center;min-height:100svh;margin:0}
  .rd{text-align:center;padding:2rem 24px;max-width:460px}
  .rd h1{color:var(--gold-rt);font-size:clamp(1.5rem,5vw,2rem);margin:0 0 .5em}
  .rd p{margin:0 0 1.4em;opacity:.85}
  .rd a{color:var(--gold-rt);font-weight:600}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold-rt);
       margin:0 4px;animation:b 1.1s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.16s}.dot:nth-child(3){animation-delay:.32s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.7}}
</style>
</head>
<body>
<main class="rd">
  <h1>Taking you to Amazon</h1>
  <p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
  <p><a id="fallback" href="AMAZON_URL_HERE">Go now if this page doesn&rsquo;t move</a></p>
</main>
<script>
  // Do NOT shorten this delay.
  // Cloudflare Web Analytics fires its beacon on the load event. Redirecting
  // sooner means this click is never counted, which is the whole point of the page.
  (function () {
    var url = document.getElementById('fallback').getAttribute('href');
    function go(){ window.location.replace(url); }
    if (document.readyState === 'complete') { setTimeout(go, 600); }
    else { window.addEventListener('load', function(){ setTimeout(go, 600); }); }
  })();
</script>
</body>
</html>
